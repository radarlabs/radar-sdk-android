import io.radar.ci.GitHubActions
import io.radar.ci.GitHubClient
import io.radar.ci.SnapshotDispatcher

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.dokka"
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

ext {
    radarVersion = '4.0.0'
}

String buildNumber = ".${System.currentTimeMillis()}"
GitHubActions githubRelease = GitHubActions.get()
boolean isSnapshot = false
if (githubRelease) {
    if (githubRelease.snapshot) {
        // Use the existing radarVersion with the -SNAPSHOT suffix
        isSnapshot = true
        buildNumber = '-SNAPSHOT'
    } else {
        buildNumber = ''
        // Use the tag from the release name as the version-to-publish / include in source code
        ext.radarVersion = githubRelease.tag
    }
}

android {
    compileSdk 36
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    defaultConfig {
        minSdk 23
        buildConfigField "String", "VERSION_NAME", "\"$radarVersion\""
        multiDexEnabled = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric loads the full Android framework per test class, so the
                // forked test JVM's heap creeps across the suite. Bound it and recycle
                // the JVM periodically so it doesn't grow unbounded and trigger the OS
                // OOM-killer (which was killing the Gradle daemon in CI mid-test).
                maxHeapSize = "2048m"
                forkEvery = 80
            }
        }
    }
    lint {
        warningsAsErrors = true
        disable += 'AndroidGradlePluginVersion'
        baseline = file("lint-baseline.xml")
    }
    namespace 'io.radar.sdk'
}

ktlint {
    version.set("1.8.0")
    android.set(true)
    baseline.set(file("ktlint-baseline.xml"))
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "com.google.android.gms:play-services-location:21.0.1"
    compileOnly "com.huawei.hms:location:6.16.0.302"
    compileOnly "com.google.android.play:integrity:1.6.0"

    // Optional fraud detection module (Git submodule)
    if (findProject(':sdk-fraud') != null) {
        compileOnly project(':sdk-fraud')
    }

    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation 'org.json:json:20211205'
    compileOnly "com.google.firebase:firebase-messaging:25.0.1"
}

tasks.register('androidSourcesJar', Jar) {
    group 'publishing'
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}

dokkaHtml.configure {
    outputDirectory.set(file("$rootDir/docs"))

    dokkaSourceSets {
        named("main") {
            noAndroidSdkLink.set(false)
        }
    }
}

dokkaJavadoc.configure {
    outputDirectory.set(layout.buildDirectory.dir("javadocs").get().asFile)
}

tasks.register('androidJavadocsJar', Jar) {
    dependsOn dokkaJavadoc
    group 'publishing'
    archiveClassifier.set("javadoc")
    from dokkaJavadoc.outputDirectory
}

// ----------------------------
//  Gradle Maven Publishing
// ----------------------------
publishing {
    publications {
        sdk(MavenPublication) {
            groupId 'io.radar'
            artifactId 'sdk'
            version "$radarVersion$buildNumber"

            artifact(layout.buildDirectory.file("outputs/aar/${project.name}-release.aar").get().asFile)
            artifact tasks.named('androidSourcesJar')
            artifact tasks.named('androidJavadocsJar')

            pom {
                name = 'Radar Android SDK'
                description = 'Android SDK for Radar, the leading geofencing and location tracking platform'
                url = 'https://radar.io'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                organization {
                    name = 'Radar Labs, Inc.'
                    url = 'https://radar.io'
                }

                developers {
                    developer {
                        id = 'radarlabs'
                        name = 'Radar Labs, Inc.'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com:radarlabs/radar-sdk-android.git'
                    developerConnection = 'scm:git:ssh://github.com:radarlabs/radar-sdk-android.git'
                    url = 'https://github.com/radarlabs/radar-sdk-android'
                }
            }
        }
    }
}

// ----------------------------
//  Artifact Signing
// ----------------------------
signing {
    def signingKey = project.findProperty('SIGNINGKEY')
    def signingPassword = project.findProperty('SIGNINGPASSWORD')
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.sdk
}

// Ensure signing tasks depend on the AAR being built
afterEvaluate {
    tasks.withType(Sign) {
        dependsOn bundleReleaseAar
    }
}

tasks.register('dispatchSnapshot') {
    group 'ci'
    description 'Send event to notify listeners that a new SNAPSHOT build has been published.'
    String username = System.getenv('PAT_USERNAME')
    String password = System.getenv('PAT_TOKEN')
    doLast {
        GitHubClient.ApiResponse result = SnapshotDispatcher.dispatchSnapshotEvent(username, password, "$radarVersion$buildNumber")
        if (result.success) {
            logger.debug("Successfully sent repository dispatch ($result.status)!")
        } else {
            logger.log(LogLevel.ERROR, "Could not send repository dispatch! $result.status: ${result.message ?: ''}\n ${result.data ?: ''}")
        }
    }
}
